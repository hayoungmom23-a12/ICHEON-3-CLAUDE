<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}

  .page{max-width:640px;margin:0 auto;padding:20px 16px 28px;display:flex;flex-direction:column;gap:22px}

  .label{font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.02em}
  .muted{color:var(--text-2);font-size:13px}
  .h1{font-size:22px;font-weight:700;color:var(--heading);line-height:1.3}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}

  .course .col{flex:1;min-width:0}
  .course.hidden{display:none}
  .badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700}
  .tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;flex-shrink:0}
  .park{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--accent-bg);color:var(--accent);font-size:14px;font-weight:700;line-height:1.4}
  .photo{height:200px;background:var(--photo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text-3);font-size:12px}
  .photo.sm{width:100px;height:75px;border-radius:8px;flex-shrink:0}
  .spot-head{padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer}
  .hint{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:12px;color:var(--text-2)}
  .open{display:none;border-top:1px solid var(--border);padding:12px 16px 6px;flex-direction:column;gap:4px}
  .spot.expanded .open{display:flex}
  .sec{font-size:12px;font-weight:700;color:var(--text-2);letter-spacing:.02em;padding:10px 0 2px;border-top:1px solid var(--border)} .sec.first{border-top:0;padding-top:6px}

  .btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 12px;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap;flex-shrink:0} .btn:hover{color:#fff;background:var(--accent-hover)}
  .btn-big{display:flex;align-items:center;justify-content:center;height:48px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;text-decoration:none} .btn-big:hover{color:#fff;background:var(--accent-hover)}

  .tip{display:flex;align-items:flex-start;gap:8px;padding:10px 0;border-bottom:1px solid var(--divider);font-size:13px} .tip:last-child{border-bottom:0}

  .footer{border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:6px;text-align:center;font-size:12px;color:var(--text-2);line-height:1.6}
  .map{height:240px;border-radius:12px;border:1px dashed #D9D1C1;background:var(--photo);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text-3);font-size:13px}

    <div>시설 운영시간·휴무는 공식 페이지와 전화로 확인했습니다.</div>
    <div>'지도 기준 정리' 표시가 있는 주차·진입 정보는 지도와 자료로 정리한 것으로, 현장 재확인 전입니다.</div>
    <div style="color:var(--text-3);margin-top:4px">이천 아이맵 · 아이 동반 가족을 위한 출발 전 확인 카드</div>
  </div>`;
}

function renderList() {
  app.innerHTML = `
    <div class="col" style="gap:6px"><div class="h1">이천 아이맵</div><div class="muted" style="font-size:14px">아이와 이천, 출발 전에 주차장과 운영시간부터 확인하세요</div></div>
    <div class="col" style="gap:10px">${REGIONS.map(r => `<div class="region"><span class="dot"></span><span><b>${r.name}</b> ${r.intro}</span></div>`).join('')}</div>
    <div class="col" style="gap:10px"><div class="label">아이 취향으로 고르기</div>
      <div class="chips">${Object.entries(TRACK).map(([k, v]) => `<button class="chip ${filter === k ? 'on' : ''}" data-track="${k}">${v}</button>`).join('')}</div></div>
    <div class="col" style="gap:12px"><div class="label">미리 만든 코스 5개</div>
      ${COURSES.map(c => `<a class="card course ${filter && filter !== c.track ? 'hidden' : ''}" href="#/course/${c.id}">
        <div class="col">
          <div class="row between"><span class="track ${c.track}">${TRACK[c.track]}</span><span class="muted" style="font-size:12px">${c.region}</span></div>
          <div class="row wrap"><span class="h3">${c.name}</span>${c.rain ? '<span class="rain">비 오는 날 OK</span>' : ''}</div>
          <div class="muted">${c.listLine}</div>
        </div>${ICON.chev}</a>`).join('')}
    </div>
    <div class="col" style="gap:10px"><div class="row between"><div class="label">스팟 5곳 위치 (조건부)</div><div style="font-size:11px;color:var(--text-3)">네이버지도 키가 준비되면 넣고, 아니면 이 상자를 뺀다</div></div>
      <div class="map"><div class="row" style="gap:14px">${ICON.pin.repeat(5)}</div><div>이천 지도 자리 (네이버지도 임베드)</div></div></div>
    ${footer()}`;
  app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { filter = filter === b.dataset.track ? null : b.dataset.track; renderList(); }));
  window.scrollTo(0, 0);
}

function spotCard(s, ref, idx, total) {
  const tips = s.tips || [];
  const tipRows = tips.map(t => { const m = t.match(/^(주차|진입|아이|운영|식사):\s*(.*)$/); return `<div class="tip">${m ? `<span class="tag">${m[1]}</span><span>${esc(m[2])}</span>` : `<span>${esc(t)}</span>`}</div>`; }).join('');
  return `<div class="card spot" data-spot="${idx}">
    <div class="photo">${ICON.cam}<span>스팟 대표 사진 자리 (없어도 됨)</span></div>
    <div class="spot-head">
      <div class="row between"><div class="row wrap"><span class="h3">${s.name}</span>${tips.length ? `<span class="badge">방문 팁 ${tips.length}</span>` : ''}</div><div class="row fold" style="gap:2px;font-size:12px;color:var(--text-2);display:none"><span>접기</span>${ICON.up}</div></div>
      <div class="park">${ICON.p}<span>${ref.parking}</span></div>
      <div class="muted">이 코스에서 가는 곳: ${ref.going}</div>
      <div class="hint">${ICON.touch}<span>누르면 자세히</span></div>
    </div>
    <div class="open">
      <div class="sec first">주차 안내</div>
      ${s.parkings.map(p => `<div class="line"><div class="l chain"><b>${p.name}</b>${ICON.arrow}<span>${p.walkTo}</span>${ICON.arrow}<span class="entry">${esc(p.entry)}</span></div><a class="btn" href="${p.mapUrl}" target="_blank" rel="noopener">네이버지도에서 열기</a></div>${p.mapBased ? `<div class="note">${ICON.info}<span>지도 기준 정리, 현장 재확인 예정</span></div>` : ''}`).join('')}
      <div class="sec">시설</div>
      ${s.facilities.map(f => `<div class="line"><div class="l"><span class="fac-name">${f.name}</span><span class="fac-sub">${esc(f.hours)}</span></div>${f.official ? `<a class="btn" href="${f.official}" target="_blank" rel="noopener">공식 페이지</a>` : ''}</div>`).join('')}
      <div class="sec">주차장·시설 사진 (선택)</div>
      <div class="strip"><div class="photo sm">${ICON.cam}</div><div class="photo sm">${ICON.cam}</div><div class="photo sm">${ICON.cam}</div></div>
      ${tips.length ? `<div class="sec">방문 팁</div>${tipRows}` : ''}
    </div>
  </div>${idx < total - 1 ? `<div class="next">${ICON.down}<span>다음 스팟</span></div>` : ''}`;
}

function renderCourse(id) {
  const c = COURSES.find(x => x.id === id);
  if (!c) { location.hash = ''; return; }
  app.innerHTML = `
    <a class="back" href="#/">${ICON.back}<span>코스 목록</span></a>
    <div class="col">
      <div class="row"><span class="track ${c.track}">${TRACK[c.track]}</span><span class="muted" style="font-size:12px">${c.region}</span>${c.rain ? '<span class="rain">비 오는 날 OK</span>' : ''}</div>
      <div class="h2">${c.name}</div><div class="muted" style="font-size:14px">${c.intro}</div>
    </div>
    ${c.spots.map((ref, i) => spotCard(SPOTS[ref.id], ref, i, c.spots.length)).join('')}
    <div class="card" style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px">
      <div class="label">식당 부록</div>
      <div class="muted">이천 식당·카페는 18~19시에 닫는 곳이 많으니 저녁은 영업시간을 먼저 확인하세요</div>
      <a class="btn-big" href="${c.food.search}" target="_blank" rel="noopener">근처 식당 네이버지도에서 보기</a>
      ${c.food.list.map((r, i) => `<div class="line" style="${i === 0 ? 'border-top:1px solid var(--divider);padding-top:12px;' : ''}"><div class="l"><span class="fac-name">${r.name}</span>${r.tip ? `<span class="fac-sub">${esc(r.tip)}</span>` : ''}</div><a class="btn" href="${r.url}" target="_blank" rel="noopener">네이버플레이스</a></div>`).join('')}
    </div>
    ${footer()}`;
  app.querySelectorAll('.spot-head').forEach(h => h.addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const card = h.closest('.spot'); card.classList.toggle('expanded');
    const on = card.classList.contains('expanded');
    h.querySelector('.hint').style.display = on ? 'none' : 'flex';
    h.querySelector('.fold').style.display = on ? 'flex' : 'none';
  }));
  window.scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#\/course\/([\w-]+)/);
  if (m) renderCourse(m[1]); else renderList();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
